<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asesmen Kesiapan Penghimpunan | Zakademia</title>
<meta name="description" content="Asesmen Kesiapan Penghimpunan Zakademia untuk lembaga zakat, wakaf, dan filantropi Islam.">
<meta property="og:title" content="Asesmen Kesiapan Penghimpunan | Zakademia">
<meta property="og:description" content="Asesmen Kesiapan Penghimpunan Zakademia untuk lembaga zakat, wakaf, dan filantropi Islam.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://zakademia.com/assets/images/og-asesmen.png?v=3">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Respondent: one short screen at a time (wizard). Owner: inbox + result view. Single light theme (Zakademia brand). */
:root{
  --bg:#FFFFF0; --paper:#FFFFFF; --mist:#F2F5E6; --ink:#10291F; --mute:#4A6355; --line:#DCE5D7;
  --deep:#0B4D33; --leaf:#6FAF78; --leaf-soft:#B9D9BE; --gold:#C99A3B; --gold-text:#8A6418; --warn:#9A3B1F;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 18px 40px -28px rgba(11,77,51,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);margin:0}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.2}
p{margin:0}
.label{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
header.top{border-bottom:1px solid var(--line);background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
header.top img{width:34px;height:34px}
header.top b{font-size:18px;color:var(--deep)}
header.top .sub{color:var(--mute);font-size:14px}
.adminbar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.adminbar button{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.adminbar button[aria-current="page"]{background:var(--deep);border-color:var(--deep);color:#FFFFF0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;font:700 15px var(--sans);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn-deep{background:var(--deep);color:#FFFFF0}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}
.btn-gold{background:var(--gold);color:#10291F}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-head h2{font-size:21px}
.card-head p{color:var(--mute);font-size:14px;max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.qlabel{font-weight:700;font-size:14.5px}
.field small{color:var(--mute);font-size:12.5px}
input[type=text],input[type=email],input[type=tel],select{font:400 16px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;width:100%}
[aria-invalid="true"]{border-color:var(--warn)!important}
.note{font-size:13.5px;color:var(--mute)}
.alert{background:#FBEFE6;border:1px solid #EBCBB4;color:#6E2C16;border-radius:14px;padding:12px 14px;font-size:14px}
.toast{font-size:14px;color:var(--deep);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- wizard ---------- */
.wz{max-width:760px;margin:0 auto;padding:22px 16px 0}
.notice{background:var(--mist);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--mute);margin-bottom:14px}
.stepbar{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.stepbar .where{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);font-weight:600}
.stepbar .where b{color:var(--deep)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);font-weight:600;min-width:0}
.steps li i{height:6px;border-radius:6px;background:var(--line);display:block;overflow:hidden}
.steps li i b{display:block;height:100%;background:var(--deep);border-radius:6px}
.steps li.done i{background:var(--leaf)}
.steps li.on{color:var(--deep)}
@media (max-width:560px){.steps li span{display:none}}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.screen h1{font-size:clamp(25px,4.4vw,34px);font-weight:800}
.screen h2{font-size:clamp(21px,3.4vw,26px);font-weight:800}
.screen h3{font-size:16px}
.screen .lead{color:var(--mute);font-size:15.5px}
.how{background:var(--mist);border-radius:16px;padding:12px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.how b{color:var(--deep)}
.how ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.facts div{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.facts b{font-size:18px;color:var(--deep)}
.facts span{font-size:13px;color:var(--mute)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.plan li>i{width:34px;height:34px;border-radius:50%;background:var(--deep);color:#FFFFF0;display:grid;place-items:center;font-style:normal;font-weight:800}
.plan li b{display:block}
.plan li span{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label{min-height:44px;padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font:600 14.5px var(--sans);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chips label:hover{border-color:var(--leaf)}
.chips input:checked+label{background:var(--deep);border-color:var(--deep);color:#FFFFF0}
.chips input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.chips.cards label{flex-direction:column;align-items:flex-start;justify-content:center;border-radius:14px;gap:1px;padding:10px 14px;text-align:left}
.chips.cards label small{font-weight:500;font-size:12.5px;color:var(--mute)}
.chips.cards input:checked+label small{color:#D7E6DA}
.chips.tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.chips.tg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ind .txt{font-size:15.5px;font-weight:600;margin-bottom:10px}
.chips.gut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.chips.gut{grid-template-columns:minmax(0,1fr)}}
.chips.gut label{border-radius:12px;font-size:13.5px;padding:8px 12px;min-height:42px}
.chips.gut label::before{content:'';width:16px;height:16px;border-radius:4px;border:1.5px solid #9DB9A4;background:#fff;flex:none}
.chips.gut input:checked+label::before{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--deep)}
.chips.yn label{min-width:84px;justify-content:center}
.ind{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0;padding-top:4px}
.ind .rung{width:48px;font-size:13.5px}
.rung.v1{background:var(--mist);border-color:var(--line);color:var(--deep)}
.rung.v2{background:var(--leaf-soft);border-color:var(--leaf-soft);color:var(--ink)}
.rung.v3{background:var(--leaf);border-color:var(--leaf);color:var(--ink)}
.rung.v4{background:var(--deep);border-color:var(--deep);color:#FFFFF0}
.lvl{font-size:13px;color:var(--gold-text);font-weight:700;margin-top:8px}
.sec{font-size:17px;padding-top:14px;border-top:1px solid var(--line)}
.triads{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.triad.missing h3,.triad.missing .pct{color:var(--warn)}
.knob{cursor:grab}.knob.unset{opacity:.45}
.vrio{display:flex;flex-direction:column;gap:12px}
.vcard{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.vcard.missing{border-color:#E3B9A6}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vhead b{font-size:15.5px}
.vrow{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.vrow p{font-size:14.5px}
.vrow p b{color:var(--deep)}
.pill.gold{background:#FFF1D6;color:#7A5410;box-shadow:inset 0 0 0 1.5px var(--gold)}
.vtable{min-width:640px}
.vtable td.vc{text-align:center;color:var(--mute)}
.vtable td.vc.yes{color:var(--deep);font-weight:700}
.chips .unk{color:var(--mute);border-style:dashed}
.chips input:checked+label.unk{background:var(--mute);border-color:var(--mute);color:#FFFFF0}
.stmt-unused{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.stmt:first-of-type{border-top:0;padding-top:4px}
.rung{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--mist);color:var(--deep);border:1.5px solid var(--line);transition:background .2s}
.rung.v1{background:var(--leaf-soft);border-color:var(--leaf-soft)}
.rung.v2{background:var(--deep);border-color:var(--deep);color:#FFFFF0}
.stmt .txt{font-size:15.5px;font-weight:600;margin-bottom:10px}
.missing .txt,.missing .qlabel{color:var(--warn)}
.missing .chips label{border-color:#E3B9A6}
.pos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--mist);border-radius:16px;padding:12px 16px}
.pos .bar{flex:1;min-width:140px;height:10px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden}
.pos .bar i{display:block;height:100%;background:var(--deep);width:0;transition:width .3s}
.pos b{color:var(--deep)}
.block{display:flex;flex-direction:column;gap:10px}
.poles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.poles div{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg)}
.poles b{display:block;color:var(--deep)}
.poles span{font-size:13.5px;color:var(--mute)}
.pair{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.pair-q{font-weight:700}
.prow{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.prow>span:first-child{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text)}
.pscale{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;max-width:520px;width:100%;align-self:center}
.pscale .end{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25;grid-row:1}
.pscale .end.r{grid-column:2;text-align:right}
.dots{grid-column:1/-1;grid-row:2;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.dots input{position:absolute;opacity:0;width:1px;height:1px}
.dots label{display:block;border-radius:50%;border:2px solid var(--leaf);background:#fff;cursor:pointer}
.dots label.s2{width:34px;height:34px}.dots label.s1{width:27px;height:27px}.dots label.s0{width:20px;height:20px;border-color:#9DB9A4}
.dots input:checked+label{background:var(--deep);border-color:var(--deep);box-shadow:0 0 0 3px #E7C982}
.dots input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.pcap{font-size:12.5px;color:var(--gold-text);font-weight:700;min-height:1.2em;text-align:center}
.missing.prow>span:first-child{color:var(--warn)}
.missing.prow .dots label{border-color:#E3B9A6}
.preview{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center;background:var(--mist);border-radius:18px;padding:14px}
.preview svg{width:100%;height:auto;display:block}
.preview p{font-size:14px;color:var(--mute)}
.preview p b{color:var(--ink)}
@media (max-width:520px){.preview{grid-template-columns:minmax(0,1fr)}.preview svg{max-width:240px;margin:0 auto}}
.kq{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.kq:first-of-type{border-top:0}
.kq small{color:var(--mute);font-size:13px}
.review>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.review>div:first-child{border-top:0}
.review b{font-size:14.5px}
.review span{font-size:14px;color:var(--mute);grid-column:1}
.review button{grid-row:1/span 2;grid-column:2;align-self:center}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mute)}
.consent input{width:22px;height:22px;margin-top:1px;accent-color:var(--deep);flex:none}
.consent.missing span{color:var(--warn)}
.nav{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 18px;margin-top:4px;background:linear-gradient(rgba(255,255,240,0),var(--bg) 35%)}
.nav .sp{flex:1}
.nav .err{color:var(--warn);font-size:13.5px;font-weight:600;flex-basis:100%}
.nav .err:empty{display:none}
.linkbtn{background:none;border:0;padding:0;font:600 14px var(--sans);color:var(--deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.thanks h1{font-size:30px}

/* ---------- inbox ---------- */
.inbox-head{padding-block:32px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.inbox-head h1{font-size:clamp(26px,3.6vw,36px)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--deep)}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.status.baru{background:#FFF1D6;color:#7A5410}
.status.terkirim{background:var(--mist);color:var(--deep)}
.empty{padding:28px;text-align:center;color:var(--mute)}
/* ---------- result ---------- */
.res-head{padding-block:28px 8px;display:flex;flex-direction:column;gap:10px}
.res-meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:14px}
.results{padding-block:12px 64px;display:flex;flex-direction:column;gap:22px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.chart svg{width:100%;height:auto;display:block}
.idxcard{align-self:start;background:var(--deep);color:#FFFFF0;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.idxcard .label{color:#E7C982}
.idx-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.idx-num{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.idx-cat{font-weight:700;font-size:16px;background:rgba(255,255,240,.14);border-radius:999px;padding:4px 12px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stages i{height:6px;border-radius:6px;background:rgba(255,255,240,.18)}
.stages i.on{background:var(--gold)}
.idxcard p{color:#D7E6DA;font-size:14px}
.story ul{margin:0;padding-left:20px}
.story li{margin-bottom:6px}
.heat{display:grid;grid-template-columns:minmax(110px,1.3fr) repeat(5,minmax(0,1fr)) auto;gap:4px;align-items:center;font-size:13px;min-width:540px}
.heat .h{font:500 11px var(--mono);color:var(--mute);text-align:center}
.heat .rowname{font-weight:600;font-size:13px}
.heat .cell{height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid var(--line)}
.heat .avg{font-weight:700;color:var(--deep);padding-left:6px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.triad{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.triad svg{width:100%;max-width:340px}
.triad .pct{font-size:12.5px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi>span{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi b{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{font-size:12px;color:var(--mute)}
.kpi.key{border-color:var(--gold);background:linear-gradient(180deg,#FFF8E6,var(--bg))}
.pill{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--mist);color:var(--deep)}
.pill.warn{background:#FFF1D6;color:#7A5410}
.pill.bad{background:#FBEFE6;color:#6E2C16}
.health{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.health .pill{font-size:14px;padding:5px 14px}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.explain div{background:var(--mist);border-radius:14px;padding:10px 14px;font-size:13.5px}
.explain b{color:var(--deep)}
.reco{border:1.5px dashed var(--gold)}
.reco h3{font-size:16px;margin-top:6px}
.reco h4{margin:6px 0 0;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.reco ol,.reco ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.reco li{font-size:14.5px}
.reco li small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.reco .step{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text);margin-right:6px}
.reco li.next{background:#FFF8E6;border-radius:10px;padding:6px 8px}

  if(k==='strategi'){if(!S.tri.dilema)miss.push(['q_tri_dilema','Tempatkan titik pada kedua segitiga.']);if(!S.tri.tuju)miss.push(['q_tri_tuju','Tempatkan titik pada kedua segitiga.']);}
  if(k==='keunggulan'){if(!S.ku.s.length)miss.push(['q_ku','Pilih minimal satu keunggulan.']);
    S.ku.s.forEach(function(key){if((S.ku.v[key]||[]).some(function(x){return x==null;})||(S.ku.v[key]||[]).length<4)miss.push(['q_v_'+key,'Jawab keempat pertanyaan untuk setiap keunggulan.']);});
    if(!S.ino.arah.length)miss.push(['q_arah','Pilih minimal satu arah inovasi.']);if(S.ino.frek==null)miss.push(['q_frek','Pilih frekuensi uji coba.']);}
  if(k==='kirim'&&!S.consent)miss.push(['q_consent','Centang persetujuan untuk mengirim.']);
  return miss;}
function showMissing(miss){miss.forEach(function(m){var e=document.getElementById(m[0]);if(!e)return;if(e.tagName==='INPUT')e.setAttribute('aria-invalid','true');else e.classList.add('missing');});
  navErr.textContent=miss[0][1]+(miss.length>1?' Bagian yang perlu dilengkapi ditandai merah.':'');var f=document.getElementById(miss[0][0]);if(f){f.scrollIntoView({block:'center',behavior:'smooth'});if(f.tagName==='INPUT')try{f.focus({preventScroll:true});}catch(_){}}}
document.getElementById('backBtn').addEventListener('click',function(){go(cur-1);});
form.addEventListener('submit',async function(e){e.preventDefault();var k=SCREENS[cur];var miss=missingOf(k);if(miss.length){showMissing(miss);return;}
  if(k!=='kirim'){go(cur+1);return;}
  for(var i=1;i<SCREENS.length-1;i++){var m2=missingOf(SCREENS[i]);if(m2.length){go(i);showMissing(m2);return;}}
  var nb=document.getElementById('nextBtn');nb.disabled=true;nb.textContent='Mengirim…';
  try{var kv={};S.ku.s.forEach(function(key){kv[key]=S.ku.v[key].slice();});
    var rec={v:4,org:S.p.org.trim(),type:S.p.type,pName:S.p.pName.trim(),pRole:S.p.pRole.trim(),pEmail:S.p.pEmail.trim(),pWa:S.p.pWa.trim(),tim:S.p.tim,
      g:S.g.map(function(dim){return dim.map(function(b){return b.join('');}).join(',');}),imp:S.imp.slice(),tri:{dilema:S.tri.dilema.slice(),tuju:S.tri.tuju.slice()},
      ku:{s:S.ku.s.slice(),v:kv},ino:{arah:S.ino.arah.slice(),frek:S.ino.frek,hamb:S.ino.hamb.slice()},kp:Object.assign({},S.kp),
      hp:document.getElementById('website').value,dikirim:new Date().toISOString(),status:'baru'};
    await saveRecord(rec);clearDraft();sent=rec;renderThanks();window.scrollTo(0,0);}
  catch(err){navErr.textContent='Asesmen belum terkirim ('+(err&&err.code||'galat')+'). Periksa koneksi lalu coba lagi, atau hubungi info@zakademia.com.';}
  finally{nb.disabled=false;if(!sent)nb.textContent='Kirim asesmen';}});
async function saveRecord(rec){var res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
  var out=await res.json().catch(function(){return null;});if(out&&out.error==='perlu_verifikasi'){saveDraft();location.href='verifikasi.php?next='+encodeURIComponent('/asesmen/');throw {code:'perlu verifikasi'};}if(out&&out.error==='perlu_masuk'){saveDraft();location.href='masuk.php?next='+encodeURIComponent('/asesmen/');throw {code:'perlu masuk'};}if(!out||!out.ok)throw {code:(out&&out.error)||('http '+res.status)};}
if(loadDraft()){var nt=document.getElementById('notice');nt.hidden=false;nt.textContent='Isian sebelumnya dipulihkan. Lanjutkan dari bagian terakhir.';}
function stateFromRecord(d){var st=decode(d);var s=blank();s.p={org:d.org||'',type:d.type||TYPES[0],pName:d.pName||'',pRole:d.pRole||'',pEmail:d.pEmail||'',pWa:d.pWa||'',tim:st.tim};s.g=st.g;s.imp=st.imp.concat([null,null,null,null,null,null]).slice(0,6);
  s.tri={dilema:st.dilema,tuju:st.tuju};s.ku={s:st.ku.s.slice(),v:JSON.parse(JSON.stringify(st.ku.v))};s.ino={arah:st.ino.arah.slice(),frek:st.ino.frek,hamb:st.ino.hamb.slice()};s.kp=Object.assign({},st.kp);s.consent=true;return s;}

render();
}

  }).catch(function(){gate('Status akun belum dapat diperiksa. Muat ulang halaman ini.');});
