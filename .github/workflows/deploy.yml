name: Terbitkan ke zakademia.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unggah ke Hostinger lewat FTP
        id: unggah1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || 'domains/zakademia.com/public_html/' }}
          timeout: 120000
          # Folder data asesmen (database dan kata sandi admin) tidak pernah diunggah atau ditimpa.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            asesmen/PANDUAN.md
            asesmen/data/**

      # Koneksi FTP Hostinger kadang terputus di tengah pengiriman; ulangi sampai dua kali.
      - name: Ulangi unggahan (percobaan 2)
        id: unggah2
        if: steps.unggah1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || 'domains/zakademia.com/public_html/' }}
          timeout: 120000
          # Folder data asesmen (database dan kata sandi admin) tidak pernah diunggah atau ditimpa.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            asesmen/PANDUAN.md
            asesmen/data/**

      - name: Ulangi unggahan (percobaan 3)
        if: steps.unggah1.outcome == 'failure' && steps.unggah2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || 'domains/zakademia.com/public_html/' }}
          timeout: 120000
          # Folder data asesmen (database dan kata sandi admin) tidak pernah diunggah atau ditimpa.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            asesmen/PANDUAN.md
            asesmen/data/**

      # Bersihkan cache server dan CDN Hostinger agar perubahan langsung terlihat (butuh secret HOSTINGER_API_TOKEN).
      - name: Bersihkan cache Hostinger
        if: success()
        env:
          HTOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: zakademia.com
        run: |
          if [ -z "$HTOKEN" ]; then echo "::notice::Lewati pembersihan cache: secret HOSTINGER_API_TOKEN belum diisi."; exit 0; fi
          API=https://developers.hostinger.com/api/hosting/v1
          user=$(curl -s --max-time 30 -H "Authorization: Bearer $HTOKEN" -H "Accept: application/json" "$API/websites?domain=$DOMAIN" | jq -r '[.. | objects | select(.domain? == env.DOMAIN) | .username // empty][0] // empty')
          if [ -z "$user" ]; then echo "::warning::Akun hosting untuk $DOMAIN tidak ditemukan lewat API Hostinger. Periksa token."; exit 0; fi
          for n in 1 2 3; do
            code=$(curl -s --max-time 60 -o /tmp/r -w "%{http_code}" -X DELETE -H "Authorization: Bearer $HTOKEN" -H "Accept: application/json" "$API/accounts/$user/websites/$DOMAIN/cache/clear")
            case "$code" in 2*) echo "::notice::Cache server dan CDN untuk $DOMAIN sudah dibersihkan."; exit 0;; esac
            sleep 10
          done
          echo "::warning::Pembersihan cache gagal (HTTP $code): $(head -c 200 /tmp/r)"
